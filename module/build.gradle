import org.apache.tools.ant.filters.FixCrLfFilter
import org.apache.tools.ant.filters.ReplaceTokens

import javax.inject.Inject
import org.gradle.api.attributes.Attribute

plugins {
    id 'com.android.library'
}

apply from: file(rootProject.file('module.gradle'))

interface InjectedExecOps {
    @Inject
    ExecOperations getExecOps()
}

android {
    flavorDimensions += "api"

    compileSdk {
        version = release(rootProject.ext.targetSdkVersion)
    }
    buildToolsVersion = '37.0.0'
    ndkVersion = '29.0.14206865'
    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        externalNativeBuild {
            cmake {
                arguments "-DMODULE_NAME:STRING=$moduleLibraryName"
            }
        }
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
    buildFeatures {
        buildConfig = true
        prefab = true
    }
    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
            version = "4.1.2"
        }
    }
    namespace = 'com.kimjio.umamusumelocalify'
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    lint {
        targetSdk = 37
    }
    testOptions {
        targetSdk = 37
    }
}


repositories {
    mavenLocal()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.window:window:1.5.1'
    implementation 'androidx.media3:media3-common:1.11.0'
    implementation 'androidx.media3:media3-session:1.11.0'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantCapped = variant.name.capitalize()
        def variantLowered = variant.name.toLowerCase()
        def buildTypeCapped = variant.buildType.capitalize()
        def buildTypeLowered = variant.buildType.toLowerCase()

        def runtimeJars = variant.runtimeConfiguration.incoming.artifactView {
            attributes {
                attribute(Attribute.of("artifactType", String), "android-classes-jar")
            }
        }.files

        def zipName = "${magiskModuleId.replace('_', '-')}-${moduleVersion}-${buildTypeLowered}.zip"
        def moduleDir = file("$outDir/module_${buildTypeLowered}")

        def generateDexTask = tasks.register("generateDex${variantCapped}", Exec) {
            dependsOn("assemble${variantCapped}")
            
            def sdkDir = androidComponents.sdkComponents.sdkDirectory.get()
            def buildToolVersion = project.android.buildToolsVersion
            def compileSdk = project.android.compileSdkVersion
            def workingDirFile = file("${layout.buildDirectory.asFile.get()}/intermediates/javac/$variantLowered")
            
            workingDir workingDirFile
            
            doFirst {
                workingDirFile.mkdirs()
                def pgRules = file("${workingDirFile}/rules.pro")
                pgRules.text = """
                    -keep class com.kimjio.umamusumelocalify.** { *; }
                    -keep class androidx.core.graphics.Insets { *; }
                    -keep class androidx.window.layout.WindowMetrics { *; }
                    -keep class androidx.window.layout.WindowMetricsCalculatorCompat { *; }
                    -dontwarn androidx.core.R**
                    -dontwarn androidx.media3.**
                    -dontwarn com.google.errorprone.annotations.**
                    -dontwarn com.google.j2objc.annotations.**
                    -dontwarn javax.annotation.**
                    -dontwarn org.checkerframework.**
                    -dontobfuscate
                    -dontoptimize
                    -keep class **.R\$* { <fields>; }
                    -ignorewarnings
                """.stripIndent()
            }

            def rJarPath = "${sdkDir}/build-tools/${buildToolVersion}/lib/d8.jar"
            def androidJar = file("${sdkDir}/platforms/${compileSdk}/android.jar")
            if (!androidJar.exists()) {
                androidJar = file("${sdkDir}/platforms/android-${compileSdk}/android.jar")
            }

            def classFiles = project.fileTree(dir: "${layout.buildDirectory.asFile.get()}/intermediates/javac/$variantLowered/compile${variantCapped}JavaWithJavac/classes", include: '**/*.class').files.collect { it.absolutePath }
            
            def rJarFiles = []
            def appRJar = project(":umamusumelocalify").layout.buildDirectory.file("intermediates/compile_and_runtime_r_class_jar/${variantLowered}/process${variantCapped}Resources/R.jar").get().asFile
            if (appRJar.exists()) {
                rJarFiles.add(appRJar)
            } else {
                rJarFiles.addAll(project.fileTree(dir: "${layout.buildDirectory.asFile.get()}/intermediates", include: "**/R.jar").files)
            }

            def d8Args = ["java", "-cp", rJarPath, "com.android.tools.r8.R8",
                          "--release", "--output", ".", "--min-api", variant.minSdk.apiLevel.toString(),
                          "--pg-conf", "rules.pro", "--lib", androidJar.absolutePath]
            d8Args.addAll(classFiles)
            d8Args.addAll(rJarFiles.unique().collect { it.absolutePath })
            d8Args.addAll(runtimeJars.files.collect { it.absolutePath })
            
            commandLine d8Args
        }

        tasks.register("prepareModuleFiles${variantCapped}", Sync) {
            dependsOn(":umamusumelocalify:assemble${variantCapped}")
            dependsOn(generateDexTask)

            def templatePath = "$rootDir/template/module"

            into moduleDir

            from(templatePath) {
                exclude "module.prop", 'system.prop', "customize.sh", "service.sh"
            }
            from(templatePath) {
                include 'module.prop'
                expand([
                        id         : magiskModuleId,
                        name       : moduleName,
                        version    : moduleVersion,
                        versionCode: moduleVersionCode.toString(),
                        author     : moduleAuthor,
                        description: "$moduleDescription",
                        updateJson : "${moduleUpdateJson}.json",
                ])
                filter(FixCrLfFilter.class,
                        eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath) {
                include 'system.prop'
                expand([
                        version: moduleVersion,
                ])
                filter(FixCrLfFilter.class,
                        eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath) {
                include("customize.sh")
                filter(ReplaceTokens.class, tokens: [
                        "MODULE_LIB_NAME": moduleLibraryName
                ])
                filter(FixCrLfFilter.class,
                        eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath) {
                include("service.sh")
                filter(ReplaceTokens.class, tokens: [
                        "MODULE_ID"      : magiskModuleId,
                        "MODULE_LIB_NAME": moduleLibraryName
                ])
                filter(FixCrLfFilter.class,
                        eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }

            from("${layout.buildDirectory.asFile.get()}/intermediates/stripped_native_libs/$variantLowered/strip${variantCapped}DebugSymbols/out/lib") {
                exclude "**/libdobby.so"
                into 'lib'
            }

            from(project(":umamusumelocalify").layout.buildDirectory.dir("outputs/apk/${buildTypeLowered}")) {
                include "**/*.apk"
                exclude "**/*-unsigned.apk", "**/*-unaligned.apk"
                includeEmptyDirs = false
                rename { "UmamusumeLocalify.apk" }
                into "system/app/UmamusumeLocalify"
            }

            from("${layout.buildDirectory.asFile.get()}/intermediates/javac/$variantLowered/") {
                include "classes.dex"
                into ''
            }
        }

        tasks.register("zip${variantCapped}", Zip) {
            dependsOn("prepareModuleFiles${variantCapped}")
            from moduleDir
            archiveFileName = zipName
            destinationDirectory = outDir
        }

        tasks.register("push${variantCapped}", Exec) {
            dependsOn("zip${variantCapped}")
            workingDir outDir
            commandLine androidComponents.sdkComponents.adb.get(), "push", zipName, "/data/local/tmp/"
        }

        tasks.register("flash${variantCapped}", Exec) {
            dependsOn("push${variantCapped}")
            commandLine androidComponents.sdkComponents.adb.get(), "shell", "su", "-c",
                    "magisk --install-module /data/local/tmp/${zipName}"
        }

        tasks.register("flashKSU${variantCapped}", Exec) {
            dependsOn("push${variantCapped}")
            commandLine androidComponents.sdkComponents.adb.get(), "shell", "su", "-c",
                    "ksud module install /data/local/tmp/${zipName}"
        }

        tasks.register("flashAP${variantCapped}", Exec) {
            dependsOn("push${variantCapped}")
            commandLine androidComponents.sdkComponents.adb.get(), "shell", "su", "-c",
                    "apd module install /data/local/tmp/${zipName}"
        }

        tasks.register("flashAndReboot${variantCapped}", Exec) {
            dependsOn("flash${variantCapped}")
            ignoreExitValue = true
            commandLine androidComponents.sdkComponents.adb.get(), "shell", "reboot", "now"
        }

        tasks.register("flashKSUAndReboot${variantCapped}", Exec) {
            dependsOn("flashKSU${variantCapped}")
            ignoreExitValue = true
            commandLine androidComponents.sdkComponents.adb.get(), "shell", "reboot", "now"
        }

        tasks.register("flashAPAndReboot${variantCapped}", Exec) {
            dependsOn("flashAP${variantCapped}")
            ignoreExitValue = true
            commandLine androidComponents.sdkComponents.adb.get(), "shell", "reboot", "now"
        }

        tasks.matching { it.name == "assemble${variantCapped}" }.configureEach {
            it.finalizedBy("zip${variantCapped}")
        }
    }
}
